version: 1
organization: SurveyBuilderLLM
defaults:
  enabled: true
  base_branches: [main]
  review_drafts: false
  trigger:
    mode: label
    labels_any: [ai-review]
  limits:
    max_changed_files: 75
    max_changed_lines: 8000
    max_file_bytes: 500000
  publish:
    inline: true
    sticky_summary: true
    advisory_only: true
  ocr:
    effort: medium
    concurrency: 1
    timeout_seconds: 3600
repositories:
  - {repository: SurveyBuilderLLM/backend, rules: config/rules/backend.json}
  - {repository: SurveyBuilderLLM/worker, rules: config/rules/worker.json}
  - {repository: SurveyBuilderLLM/ui, rules: config/rules/frontend.json}
  - {repository: SurveyBuilderLLM/aayvu-db, rules: config/rules/backend.json}
  - {repository: SurveyBuilderLLM/website, rules: config/rules/frontend.json}
  - {repository: SurveyBuilderLLM/docs, rules: config/rules/docs.json}
  - {repository: SurveyBuilderLLM/cli, rules: config/rules/general.json}
  - {repository: SurveyBuilderLLM/workspace, rules: config/rules/general.json}

